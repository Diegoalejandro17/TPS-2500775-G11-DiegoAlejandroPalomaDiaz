<!--  
    - html es lenguaje de etiquetado
    - a continuacion se define la estructura basica del html     
-->

<html>
    <head>
        <!-- 
            En el head esta el codigo que no hace parte de lo visual en una pagina web 
            la etiqueta "title" psemos nombrar la pestania del explorador   
        -->
        <title>Mi primera programada</title>
    </head>
    <body>
        <!-- header se usa en el body porque es parte de lo visual -->
        <h1>Primer intento de hacer cafe</h1>
        <!-- El paragraph se usa en el body porque es parte de lo
        visual, con esta etiqueta se clasifica un texto como parrafo -->
        <p>Este es nuestro primer cafecito</p>
    </body>
</html>
